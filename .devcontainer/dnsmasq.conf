# Local resolver whose only job is to log every DNS query the container
# makes, then forward it on exactly as before. This is what gives visibility
# into blocked egress: every outbound connection starts with a lookup of the
# hostname, so "what did Claude just try to reach" shows up here as a domain
# name — which is far more useful than the raw IP an iptables LOG rule would
# give you. Forwarding goes to Docker's embedded DNS (127.0.0.11), which
# already resolves both compose service names (e.g. `db`) and public domains,
# so nothing about actual resolution behavior changes.
no-resolv
no-hosts
server=127.0.0.11
log-queries
log-facility=/var/log/dns-queries.log
listen-address=127.0.0.1
bind-interfaces
port=53
user=root
group=root
